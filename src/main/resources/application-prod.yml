# Production / Railway profile
# Activate with: SPRING_PROFILES_ACTIVE=prod
# Railway provides PORT + DATABASE_URL (converted to JDBC in docker/entrypoint.sh)

server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quizapp}?currentSchema=${DB_SCHEMA:public}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: quiz-hikari-prod
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000
      connection-test-query: SELECT 1
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:public}
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:public}
    default-schema: ${DB_SCHEMA:public}
    table: flyway_schema_history
    baseline-on-migrate: true
    validate-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}
  seed:
    # Seed on first deploy; set SEED_ENABLED=false after data exists if you prefer
    enabled: ${SEED_ENABLED:true}
    allotted-time-ms: ${SEED_ALLOTTED_TIME_MS:60000}

logging:
  level:
    root: INFO
    com.quizapp: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
    com.zaxxer.hikari: INFO
