# Local profile — always used for local runs (see spring.profiles.active in application.yml).
# Edit THESE values for your Postgres. Do not rely on shell env for day-to-day local work.

server.port=8081

# --- PostgreSQL (required) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/quizapp?currentSchema=public
spring.datasource.username=abhinavverma
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.pool-name=quiz-hikari-local
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# --- JPA / Hibernate ---
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.default-schema=public
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# --- App ---
app.jwt.secret=quiz-app-dev-secret-change-me-please-32bytes-min
app.jwt.expiration-ms=604800000
app.seed.enabled=true
app.seed.allotted-time-ms=60000

app.database.schema=public
app.database.tables.users=users
app.database.tables.subjects=subjects
app.database.tables.questions=questions
app.database.tables.quizzes=quizzes
app.database.tables.quiz-questions=quiz_questions
app.database.tables.user-quiz-attempts=user_quiz_attempts
app.database.tables.user-quiz-attempt-questions=user_quiz_attempt_questions
app.database.tables.revisions=revisions
app.database.tables.revision-questions=revision_questions
app.database.tables.flyway-history=flyway_schema_history

# --- Logging ---
logging.level.root=INFO
logging.level.com.quizapp=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.flywaydb=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.postgresql=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
